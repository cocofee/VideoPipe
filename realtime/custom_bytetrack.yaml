# Custom ByteTrack parameters for Bicycle Timing
# Optimized for 60fps and high-speed motion

tracker_type: bytetrack
track_high_thresh: 0.16 # (float) threshold for the first association
track_low_thresh: 0.06
new_track_thresh: 0.16
track_buffer: 30       # (int) buffer to keep lost tracks
match_thresh: 0.7      # (float) threshold for matching tracks
fuse_score: True
